# Gnome
    - id: *ridingTrainerGnomeBinjyFeatherwhistle
      quest: *ridingTrainerGnomeBinjyFeatherwhistleQuest
# Dranei
    - id: *ridingTrainerDraneiAalun
      quest: *ridingTrainerDraneiAalunQuest

# Horde
